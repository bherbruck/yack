# yack: temporary crate holding springrep's kernel verbatim (PLAN §3.2); deleted by M3.
# Adapted from springrep@a03e8a1 Cargo.toml (MIT, (c) 2026 Springcraft, Inc.).
# Changes: renamed to yack-springrep; version kept 1.0.1; workspace edition/rust-version/publish; licence per
#   layers.toml; workspace lints not inherited (verbatim donor code; M2/M3 brings it under them).
[package]
name = "yack-springrep"
description = "Temporary: springrep v1.0.1 kernel, copied verbatim (deleted by M3)"
version = "1.0.1"  # springrep's own: `yack_springrep::VERSION` reads it
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = false
build = "build.rs"

[dependencies]
yack-view = { path = "../yack-view" }
yack-step = { path = "../yack-step" }
yack-edit = { path = "../yack-edit" }
yack-blend = { path = "../yack-blend" }
yack-boolean = { path = "../yack-boolean" }
yack-tweak = { path = "../yack-tweak" }
yack-build = { path = "../yack-build" }
yack-mesh = { path = "../yack-mesh" }
yack-check = { path = "../yack-check" }
yack-codec = { path = "../yack-codec" }
yack-measure = { path = "../yack-measure" }
yack-locate = { path = "../yack-locate" }
yack-intersect = { path = "../yack-intersect" }
yack-profile = { path = "../yack-profile" }
yack-topo = { path = "../yack-topo" }
yack-geom = { path = "../yack-geom" }
yack-math = { path = "../yack-math" }
yack-base = { path = "../yack-base" }
yack-numeric = { path = "../yack-numeric" }
yack-tol = { path = "../yack-tol" }
yack-p21 = { path = "../yack-p21" }

[lints.rust]
unsafe_code = "forbid"

# The donor code uses HashMap/HashSet, Instant and one env switch (root clippy.toml bans them);
# M2 removes them. Allowed here so clippy can reach the crates that depend on this one.
[lints.clippy]
disallowed_types = "allow"
disallowed_methods = "allow"
