# yack: temporary converter between springrep's Brep and cadrs's Body (PLAN §3.2, M1.9); deleted by M4.
[package]
name = "yack-bridge"
description = "Temporary: lossless springrep Brep <-> cadrs Body conversion (deleted by M4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = false

[dependencies]
yack-cadrs = { path = "../yack-cadrs" }
yack-base = { path = "../yack-base" }
yack-check = { path = "../yack-check" }
yack-geom = { path = "../yack-geom" }
yack-math = { path = "../yack-math" }
yack-topo = { path = "../yack-topo" }
yack-locate = { path = "../yack-locate" }
yack-measure = { path = "../yack-measure" }
yack-mesh = { path = "../yack-mesh" }
yack-tol = { path = "../yack-tol" }

[dev-dependencies]
yack-blend = { path = "../yack-blend" }
yack-boolean = { path = "../yack-boolean" }
yack-build = { path = "../yack-build" }
yack-edit = { path = "../yack-edit" }
yack-profile = { path = "../yack-profile" }
yack-step = { path = "../yack-step" }
yack-view = { path = "../yack-view" }

[lints]
workspace = true

[features]
# M1.15 step 3's retry with fitted pcurves; off until its re-enable conditions hold (to_springrep.rs).
fitted-retry = []
