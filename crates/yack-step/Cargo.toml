[package]
name = "yack-step"
description = "yack internal crate (not published; use the `yack` crate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
yack-boolean = { path = "../yack-boolean" }
yack-build = { path = "../yack-build" }
yack-check = { path = "../yack-check" }
yack-geom = { path = "../yack-geom" }
yack-numeric = { path = "../yack-numeric" }
yack-topo = { path = "../yack-topo" }
yack-base = { path = "../yack-base" }
yack-math = { path = "../yack-math" }
yack-p21 = { path = "../yack-p21" }
yack-tol = { path = "../yack-tol" }
yack-codec = { path = "../yack-codec" }
yack-measure = { path = "../yack-measure" }

[dev-dependencies]
yack-profile = { path = "../yack-profile" }

[lints]
workspace = true

[features]
# The file measurer while it is brought up; on by default once it builds (w-m11-springrep).
wip = []

[[example]]
name = "measure"
required-features = ["wip"]
