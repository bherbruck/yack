# yack: virtual workspace. Every crate lives in crates/<name>; the DAG is layers.toml.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bherbruck/yack"
publish = false

# No [workspace.dependencies]: shipped crates have zero external dependencies (PLAN R4).

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
disallowed_types = "deny"
disallowed_methods = "deny"

# The kernel's tests build blends and gears: unoptimised they take minutes (springrep's choice).
[profile.dev]
opt-level = 1

[profile.release]
# Fast to rebuild during development (the swarm builds release constantly). Official timing
# runs use `--profile dist`.
debug = 0
lto = false
codegen-units = 16
incremental = true

# Official benchmark timing builds: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# For sampling stacks: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
lto = false
codegen-units = 16
