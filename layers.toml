# yack crate DAG (PLAN §3). `cargo xtask gate` enforces it (PLAN §6.6).
#
# Each [crate.<name>] entry:
#   layer      = n          a crate may depend only on crates of strictly lower layer
#   kind       = "kernel" | "public" | "tool" | "temporary"
#   owner      = "<agent or lead>"   the only one who edits it (AGENTS.md rule 3)
#   deps       = [..]       the allow-list of internal dependencies (package names)
#   delete_by  = "Mn"       temporary crates only: the gate fails once tag `mn` exists
#   license    = ".."       expected Cargo `license`; "Apache-2.0" iff it holds Apache-only code
#   external   = [..]       tool crates only: the external packages it may use
# In deps, "*kernel" means every crate of kind "kernel".
#
# A crate listed here need not exist yet (crates are created when first needed). A crate under
# crates/ that is not listed fails the gate. Tool crates sit outside the kernel DAG: nothing in
# the kernel may depend on them.

[reexport]
# The only internal items `yack` may re-export as they are (values from yack-math; Error, ErrorKind,
# Stage and Result from yack-base, because value constructors return them).
items = ["Point2", "Point3", "Vec3", "Dir3", "Frame", "Angle", "Aabb", "Rigid", "Similarity", "Affine", "Error", "ErrorKind", "Stage", "Result"]

